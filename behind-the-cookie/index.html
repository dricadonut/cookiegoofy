<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Behind the Cookie — Cookie Goofy</title>

  <style>
    :root {
      --bg: #f4f1eb;
      --surface: #fffdf8;
      --text: #201c20;
      --muted: #6d5a72;
      --green: #5efc8d;
      --mint: #8ef9f3;
      --blue: #93bedf;
      --purple: #8377d1;
      --border: rgba(32, 28, 32, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(142, 249, 243, 0.35),
          transparent 25%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(131, 119, 209, 0.18),
          transparent 28%
        ),
        var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        radial-gradient(
          circle,
          var(--purple) 1px,
          transparent 1px
        );
      background-size: 22px 22px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 75%
      );
    }

    .shell {
      width: min(100%, 520px);
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-name {
      font-family:
        "Times New Roman",
        Georgia,
        serif;
      font-size: clamp(2.8rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.075em;
      line-height: 0.8;
      margin: 0;
    }

    .brand-subtitle {
      margin-top: 18px;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card {
      position: relative;
      background: rgba(255, 253, 248, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: clamp(28px, 7vw, 46px);
      box-shadow:
        0 24px 70px rgba(32, 28, 32, 0.10),
        0 4px 14px rgba(32, 28, 32, 0.05);
    }

    .card::before {
      content: "✦";
      position: absolute;
      top: 18px;
      right: 24px;
      font-family: Arial, sans-serif;
      font-size: 1.1rem;
      color: var(--purple);
      animation: float 4s ease-in-out infinite;
    }

    .eyebrow {
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.2rem);
      line-height: 0.95;
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 16px 0 30px;
      color: var(--muted);
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      font-size: 0.88rem;
      line-height: 1.65;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 16px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--text);
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition:
        border-color 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease;
    }

    input:hover {
      border-color: rgba(131, 119, 209, 0.45);
    }

    input:focus {
      border-color: var(--purple);
      box-shadow:
        0 0 0 4px rgba(131, 119, 209, 0.12);
      transform: translateY(-1px);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px 20px;
      margin-top: 8px;
      background: var(--text);
      color: white;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: var(--purple);
      box-shadow:
        0 12px 30px rgba(131, 119, 209, 0.25);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 95, 95, 0.09);
      border: 1px solid rgba(255, 95, 95, 0.2);
      color: #8d3434;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .error.visible {
      display: block;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(109, 90, 114, 0.75);
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-5px) rotate(8deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="shell">

    <header class="brand">
      <h2 class="brand-name">cookie goofy</h2>

      <div class="brand-subtitle">
        Behind the Cookie
      </div>
    </header>

    <section class="card">

      <div class="eyebrow">
        Private area
      </div>

      <h1>
        Welcome backstage.
      </h1>

      <p class="intro">
        Esta área é privada. Entra com as credenciais
        da administração da Cookie Goofy.
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="username">
            Username
          </label>

          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          id="loginButton"
          type="submit"
        >
          Enter the chaos
        </button>

      </form>

      <div
        id="errorMessage"
        class="error"
        role="alert"
      ></div>

    </section>

    <footer class="footer">
      Cookie Goofy · Stay Weird. Eat Cookies.
    </footer>

  </main>

  <script>
    const API_URL =
      "https://cookie-goofy-api.dricadonut.workers.dev";

    const form =
      document.getElementById("loginForm");

    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const errorMessage =
      document.getElementById("errorMessage");

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add("visible");
    }

    function hideError() {
      errorMessage.textContent = "";
      errorMessage.classList.remove("visible");
    }

    async function checkExistingSession() {
      try {
        const response = await fetch(
          `${API_URL}/api/auth-check`,
          {
            method: "GET",
            credentials: "include"
          }
        );

        if (response.ok) {
          const data = await response.json();

          if (data.authenticated) {
            window.location.href =
              "./dashboard.html";
          }
        }
      } catch {
        // Não interromper o carregamento da página.
      }
    }

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        hideError();

        const username =
          usernameInput.value.trim();

        const password =
          passwordInput.value;

        if (!username || !password) {
          showError(
            "Preenche os dois campos para continuar."
          );

          return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "A entrar...";

        try {

          const response = await fetch(
            `${API_URL}/api/login`,
            {
              method: "POST",
              credentials: "include",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                username,
                password
              })
            }
          );

          const data =
            await response.json();

          if (!response.ok) {
            showError(
              data.error ||
              "Não foi possível iniciar sessão."
            );

            return;
          }

          window.location.href =
            "./dashboard.html";

        } catch (error) {

          showError(
            "Não foi possível contactar o servidor. Tenta novamente."
          );

        } finally {

          loginButton.disabled = false;
          loginButton.textContent =
            "Enter the chaos";
        }
      }
    );

    checkExistingSession();
  </script>

</body>
</html>
